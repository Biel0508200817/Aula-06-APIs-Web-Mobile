<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ribeiro Pichau</title>

    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        barlow: ['Barlow', 'sans-serif'],
                    },
                    colors: {
                        primary: '#ca3c3f'
                    }
                }
            }
        }
    </script>
</head>

<body class="font-barlow bg-gray-900 text-gray-100">

    <!-- HEADER -->
    <header class="flex items-center justify-between px-6 mt-6">
        <h1 class="text-xl font-bold">Ribeiro Pichau</h1>

        <button id="menuBtn" class="md:hidden text-3xl">☰</button>

        <nav class="hidden md:block">
            <ul class="flex gap-8 text-lg">
                <li><a href="#cardapio" class="hover:text-primary">Produtos</a></li>
            </ul>
        </nav>
    </header>

    <!-- MENU MOBILE -->
    <div id="mobileMenu"
        class="fixed top-0 right-[-100%] w-[70%] h-full bg-gray-900 text-white shadow-lg transition-all duration-300 p-8 md:hidden z-50">

        <button id="closeBtn" class="text-2xl mb-6">✕</button>

        <ul class="flex flex-col gap-6 text-lg">
            <li><a href="#cardapio">Produtos</a></li>
        </ul>
    </div>

    <!-- BANNER -->
    <section class="text-center p-8">
        <h1 class="text-3xl font-bold">
            Monte seu setup gamer 🔥
        </h1>

        <a href="#cardapio"
            class="inline-block mt-4 px-8 py-4 border border-gray-600 rounded-full hover:bg-primary transition">
            Ver Produtos
        </a>
    </section>

    <!-- PRODUTOS -->
    <section id="cardapio" class="max-w-[90vw] mx-auto p-8">

        <h2 class="text-3xl font-bold text-center mb-8">Produtos</h2>

        <nav id="nav-categorias" class="flex gap-2 overflow-x-auto mb-6"></nav>

        <div id="lista-produtos" class="grid grid-cols-2 gap-4"></div>
    </section>

    <script>
        const API_URL = 'https://hrdware-back-ycoz.vercel.app/api';
        const navCategorias = document.getElementById('nav-categorias');
        const listaProdutos = document.getElementById('lista-produtos');

        let categorias = [];

        async function carregarCategorias() {
            const res = await fetch(`${API_URL}/categorias`);
            categorias = await res.json();

            categorias.forEach(cat => {
                const btn = document.createElement('button');
                btn.innerText = cat.nome;
                btn.className = "px-4 py-2 bg-gray-800 rounded-full";
                btn.onclick = () => carregarProdutos(cat.id);
                navCategorias.appendChild(btn);
            });

            if (categorias.length > 0) carregarProdutos(categorias[0].id);
        }

        async function carregarProdutos(id) {
            listaProdutos.innerHTML = "Carregando...";

            const res = await fetch(`${API_URL}/produtos`);
            const produtos = await res.json();

            const filtrados = produtos.filter(p => p.categoria_id == id);

            listaProdutos.innerHTML = "";

            filtrados.forEach(p => {
                const card = document.createElement('div');

                card.className = "bg-gray-800 p-3 rounded-xl border border-gray-700";

                card.innerHTML = `
                    <img src="${p.imagem}" class="h-24 mx-auto object-contain">
                    <h3 class="font-bold mt-2">${p.nome}</h3>
                    <p class="text-primary font-bold mt-1">
                        ${p.preco.toLocaleString('pt-BR', {style:'currency',currency:'BRL'})}
                    </p>
                `;

                listaProdutos.appendChild(card);
            });
        }

        carregarCategorias();
    </script>

    <!-- MENU SCRIPT -->
    <script>
        const menuBtn = document.getElementById("menuBtn");
        const closeBtn = document.getElementById("closeBtn");
        const mobileMenu = document.getElementById("mobileMenu");

        menuBtn.onclick = () => mobileMenu.style.right = "0";
        closeBtn.onclick = () => mobileMenu.style.right = "-100%";
    </script>

</body>

</html>
